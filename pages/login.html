<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — ResumeIQ</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span>Resume</span>IQ</div>
    <div class="auth-tagline">Analyze. Improve. Get Interview Ready.</div>

    <div id="error-box" class="alert alert-danger hidden"></div>

    <div class="form-group">
      <label class="form-label">Email address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="doLogin()">
      Sign in
    </button>

    <div class="auth-divider">or</div>

    <p class="text-center text-sm" style="color:var(--white-dim)">
      Don't have an account? <a href="register.html">Create one</a>
    </p>

    <hr class="divider"/>
    <p class="text-center text-xs text-muted">
      Demo admin: <strong>admin@resumeiq.com</strong> / <strong>admin123</strong>
    </p>
  </div>
</div>

<script src="../js/auth.js"></script>
<script>
  Auth.requireGuest('../pages/dashboard.html');

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errBox   = document.getElementById('error-box');
    errBox.classList.add('hidden');

    if (!email || !password) {
      errBox.textContent = 'Please fill in all fields.';
      errBox.classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const result = Auth.login(email, password);
    if (!result.ok) {
      errBox.textContent = result.error;
      errBox.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }

    window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
